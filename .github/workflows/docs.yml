name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'README.md'
      - 'docs/index.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Regenerate API documentation
        run: bun run docs
      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/main.json
          if git diff --cached --quiet; then
            echo "docs/main.json is up to date"
          else
            git commit -m "docs: regenerate main.json [skip ci]"
            git push
          fi
      - name: Deploy to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: bunx netlify-cli deploy --prod --dir=docs
