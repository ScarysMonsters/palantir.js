<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>palantir.js - API Documentation</title>
<link rel="icon" href="logo.svg" />
<style>
  :root {
    --bg: #0b0e14;
    --panel: #11151d;
    --panel-2: #161b25;
    --border: #232a37;
    --text: #d7dce5;
    --muted: #8a93a6;
    --accent: #7c8cf8;
    --code-bg: #161b25;
    --warn: #f0b132;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  code, pre, .sig, .type {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 18px;
    background: rgba(11, 14, 20, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); }
  .brand:hover { text-decoration: none; }
  .brand img { height: 20px; }
  .brand .name { font-weight: 700; letter-spacing: .2px; }
  .brand .tag { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
  #search {
    margin-left: auto;
    width: min(420px, 45vw);
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    outline: none;
  }
  #search:focus { border-color: var(--accent); }

  .layout { display: flex; align-items: flex-start; }

  aside {
    position: sticky; top: 53px;
    width: 300px; min-width: 300px;
    height: calc(100vh - 53px);
    overflow: auto;
    padding: 14px 8px 40px 14px;
    border-right: 1px solid var(--border);
  }
  aside .welcome-link {
    display: block; padding: 6px 10px; border-radius: 6px; color: var(--text); font-weight: 600;
  }
  aside .welcome-link.active { background: var(--panel-2); color: var(--accent); }
  details.group { margin-top: 12px; }
  details.group > summary {
    cursor: pointer; padding: 4px 10px; user-select: none;
    color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: .1em;
  }
  details.group > summary .count { margin-left: 8px; opacity: .7; }
  .items { display: flex; flex-direction: column; padding: 4px 0 4px 6px; }
  .nav-item {
    padding: 3px 10px; border-radius: 6px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px;
  }
  .nav-item:hover { background: var(--panel-2); text-decoration: none; }
  .nav-item.active { background: var(--panel-2); color: var(--accent); font-weight: 600; }
  .nav-empty { color: var(--muted); padding: 8px 10px; display: none; }

  main { flex: 1; min-width: 0; padding: 26px 34px 120px; max-width: 980px; }
  h1.title { font-size: 26px; margin: 0 0 6px; }
  h1.title .kind {
    font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; vertical-align: middle; margin-left: 10px;
  }
  .muted { color: var(--muted); }
  .desc > p:first-child { margin-top: 8px; }

  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); margin-left: 6px; vertical-align: middle;
  }
  .badge.warn { color: var(--bg); background: var(--warn); border-color: var(--warn); font-weight: 700; }

  h2.section {
    font-size: 15px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
    border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 34px 0 14px;
  }
  .member {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin: 12px 0;
  }
  .member.target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .member h3 { margin: 0 0 4px; font-size: 16px; }
  .member h3 .anchor { color: var(--border); margin-right: 6px; font-weight: 400; }
  .member h3 .anchor:hover { color: var(--accent); text-decoration: none; }
  .sig {
    margin: 4px 0 10px; color: var(--text); background: var(--code-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: nowrap;
  }
  .sig .ret { color: var(--muted); }
  .sig .ro { color: var(--warn); }

  table { border-collapse: collapse; width: 100%; margin: 10px 0 4px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border: 1px solid var(--border); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  td.type, td.prop { white-space: nowrap; }
  td.prop { font-weight: 600; }
  .type { color: #9ecbff; }
  .nullable { color: var(--warn); }

  .markdown { max-width: 860px; }
  .markdown h1 { font-size: 26px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .markdown h2 { font-size: 21px; margin-top: 34px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .markdown h3 { font-size: 17px; margin-top: 26px; }
  .markdown img { max-width: 100%; }
  .markdown pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .markdown code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; }
  .markdown pre code { background: none; padding: 0; }
  .markdown table { display: block; overflow-x: auto; }
  .markdown blockquote {
    margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--accent);
    background: var(--panel); border-radius: 0 8px 8px 0;
  }
  .markdown hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    aside { position: static; width: 100%; min-width: 0; height: auto; max-height: 38vh; border-right: none; border-bottom: 1px solid var(--border); }
    main { padding: 20px 16px 80px; }
    .topbar { flex-wrap: wrap; }
    #search { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/welcome">
    <img src="logo.svg" alt="" />
    <span class="name">palantir.js</span>
    <span class="tag">docs</span>
  </a>
  <input id="search" type="search" placeholder="Search classes, methods, properties, events..." autocomplete="off" />
</header>

<div class="layout">
  <aside id="nav"><p class="muted" style="padding:10px">Loading...</p></aside>
  <main id="content"><p class="muted">Loading documentation...</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  'use strict';

  var SECTIONS = {
    class: { key: 'classes', label: 'Classes' },
    interface: { key: 'interfaces', label: 'Interfaces' },
    typedef: { key: 'typedefs', label: 'Typedefs' },
    external: { key: 'externals', label: 'Externals' }
  };

  var state = { doc: null, bySection: {}, nav: null, content: null, search: null };

  /* ---------------------------------------------------------------- utils */

  function esc(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function md(text) {
    if (text === undefined || text === null) return '';
    if (window.marked && typeof window.marked.parse === 'function') {
      try { return window.marked.parse(String(text)); } catch (error) { /* fall through */ }
    }
    return '<pre>' + esc(text) + '</pre>';
  }

  function mdInline(text) {
    if (text === undefined || text === null) return '';
    if (window.marked && typeof window.marked.parseInline === 'function') {
      try { return window.marked.parseInline(String(text)); } catch (error) { /* fall through */ }
    }
    return esc(text);
  }

  function typeStr(type) {
    if (type === undefined || type === null) return 'any';
    if (typeof type === 'string') return esc(type);
    if (Array.isArray(type)) {
      if (!type.length) return 'any';
      return type
        .map(function (variant) {
          if (Array.isArray(variant)) {
            return variant
              .map(function (part) { return Array.isArray(part) ? part.join('') : String(part); })
              .join('');
          }
          return String(variant);
        })
        .map(esc)
        .join(' | ');
    }
    if (typeof type === 'object' && type.types) return typeStr(type.types);
    return esc(String(type));
  }

  function typeInfo(type) {
    if (type && !Array.isArray(type) && typeof type === 'object' && type.types) {
      return { html: typeStr(type.types), nullable: Boolean(type.nullable), description: type.description || '' };
    }
    return { html: typeStr(type), nullable: false, description: '' };
  }

  function typeCell(type) {
    var info = typeInfo(type);
    return '<span class="type">' + info.html + '</span>' + (info.nullable ? '<span class="nullable">?</span>' : '');
  }

  function slug(text) {
    return String(text).toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }

  function linkSee(see) {
    if (!see) return '';
    return see.map(function (entry) {
      var match = /\{@link\s+(\S+)(?:\s+([^}]+))?\}/.exec(entry);
      if (match) {
        var url = match[1];
        var label = match[2] || url;
        return '<a href="' + esc(url) + '" rel="noopener">' + esc(label) + '</a>';
      }
      return esc(entry);
    }).join(', ');
  }

  /* ------------------------------------------------------------- rendering */

  function paramsTable(params) {
    if (!params || !params.length) return '';
    var rows = params.map(function (param) {
      var flags = [];
      if (param.optional) flags.push('optional');
      if (param.variable) flags.push('variable');
      if (param.default !== undefined && param.default !== null && param.default !== '') {
        flags.push('default: ' + esc(param.default));
      }
      var description = param.description ? mdInline(param.description) : '';
      if (flags.length) description += ' <span class="badge">' + flags.join(' · ') + '</span>';
      return (
        '<tr>' +
        '<td class="prop">' + esc(param.name) + '</td>' +
        '<td class="type">' + typeCell(param.type) + '</td>' +
        '<td>' + description + '</td>' +
        '</tr>'
      );
    });
    return (
      '<table><thead><tr><th>Parameter</th><th>Type</th><th>Description</th></tr></thead><tbody>' +
      rows.join('') +
      '</tbody></table>'
    );
  }

  function signature(name, params, returns, prefix) {
    var args = (params || []).map(function (param) {
      return param.optional ? '[' + esc(param.name) + ']' : esc(param.name);
    }).join(', ');
    var line = esc(prefix || '') + esc(name) + '(' + args + ')';
    if (returns) {
      var info = typeInfo(returns);
      if (info.html && info.html !== 'void' && info.html !== '*') {
        line += ' <span class="ret">→</span> <span class="type">' + info.html + '</span>';
      }
    }
    return '<div class="sig">' + line + '</div>';
  }

  function memberCard(options) {
    var badges = '';
    if (options.access && options.access !== 'public') badges += '<span class="badge">' + esc(options.access) + '</span>';
    if (options.readonly) badges += '<span class="badge">readonly</span>';
    if (options.inherited) badges += '<span class="badge" title="' + esc(options.inherits || '') + '">inherited</span>';
    if (options.deprecated) badges += '<span class="badge warn">deprecated</span>';

    var body = '';
    if (options.description) body += '<div class="desc">' + md(options.description) + '</div>';
    if (options.params) body += paramsTable(options.params);
    if (options.returns && options.returns.description) {
      body += '<p class="muted">Returns: ' + mdInline(options.returns.description) + '</p>';
    }
    if (options.examples && options.examples.length) {
      body += options.examples.map(function (example) {
        return '<pre><code>' + esc(String(example)) + '</code></pre>';
      }).join('');
    }

    return (
      '<section class="member" id="' + options.id + '">' +
      '<h3><a class="anchor" href="' + options.href + '">#</a>' + esc(options.name) + badges + '</h3>' +
      (options.signature || '') +
      body +
      '</section>'
    );
  }

  function propsSection(props) {
    if (!props || !props.length) return '';
    var rows = props.map(function (prop) {
      var flags = [];
      if (prop.readonly) flags.push('readonly');
      if (prop.access && prop.access !== 'public') flags.push(prop.access);
      if (prop.deprecated) flags.push('deprecated');
      var flagsHtml = flags.length ? ' <span class="badge">' + flags.join(' · ') + '</span>' : '';
      var description = prop.description ? mdInline(prop.description) : '';
      return (
        '<tr>' +
        '<td class="prop">' + esc(prop.name) + flagsHtml + '</td>' +
        '<td class="type">' + typeCell(prop.type) + '</td>' +
        '<td>' + description + '</td>' +
        '</tr>'
      );
    });
    return (
      '<h2 class="section">Properties</h2>' +
      '<table><thead><tr><th>Property</th><th>Type</th><th>Description</th></tr></thead><tbody>' +
      rows.join('') +
      '</tbody></table>'
    );
  }

  function methodsSection(kind, name, methods, scope) {
    if (!methods || !methods.length) return '';
    var cards = methods.map(function (method) {
      if (scope === 'own' && method.inherited) return '';
      return memberCard({
        id: 'member-m-' + method.name,
        href: '#/' + kind + '/' + encodeURIComponent(name) + '/m/' + encodeURIComponent(method.name),
        name: method.name,
        access: method.access,
        inherited: method.inherited,
        inherits: method.inherits,
        deprecated: method.deprecated,
        signature: signature(method.name, method.params, method.returns, method.scope === 'static' ? 'static ' : ''),
        description: method.description,
        params: method.params,
        returns: method.returns,
        examples: method.examples
      });
    }).join('');
    return '<h2 class="section">Methods</h2>' + cards;
  }

  function eventsSection(kind, name, events) {
    if (!events || !events.length) return '';
    var cards = events.map(function (event) {
      return memberCard({
        id: 'member-e-' + event.name,
        href: '#/' + kind + '/' + encodeURIComponent(name) + '/e/' + encodeURIComponent(event.name),
        name: event.name,
        description: event.description,
        params: event.params
      });
    }).join('');
    return '<h2 class="section">Events</h2>' + cards;
  }

  function renderItem(kind, name, member) {
    var cfg = SECTIONS[kind];
    var item = cfg && state.bySection[cfg.key] ? state.bySection[cfg.key].get(name) : null;
    var content = state.content;
    if (!item) {
      content.innerHTML = '<h1 class="title">Not found</h1><p class="muted">No ' + esc(kind) + ' named "' + esc(name) + '".</p>';
      return;
    }

    var out = [];
    out.push('<h1 class="title">' + esc(item.name) + '<span class="kind">' + esc(kind) + '</span></h1>');
    if (item.deprecated) {
      out.push('<p class="muted">Deprecated' + (typeof item.deprecated === 'string' ? ': ' + esc(item.deprecated) : '') + '</p>');
    }
    if (item.description) out.push('<div class="desc">' + md(item.description) + '</div>');
    if (kind === 'external') {
      if (item.see) out.push('<p class="muted">See ' + linkSee(item.see) + '</p>');
      content.innerHTML = out.join('');
      return;
    }
    if (item.extends) out.push('<p class="muted">Extends ' + typeCell(item.extends) + '</p>');
    if (item.implements) out.push('<p class="muted">Implements ' + typeCell(item.implements) + '</p>');
    if (kind === 'typedef' && item.type) out.push('<p class="muted">Type ' + typeCell(item.type) + '</p>');

    if (item.construct) {
      out.push('<h2 class="section">Constructor</h2>');
      out.push(
        memberCard({
          id: 'member-c',
          href: '#/' + kind + '/' + encodeURIComponent(name) + '/c/constructor',
          name: 'new ' + item.name,
          access: item.construct.access,
          signature: signature(item.name, item.construct.params, null),
          description: item.construct.description,
          params: item.construct.params
        })
      );
    }
    if (item.props && item.props.length) out.push(propsSection(item.props));
    if (item.methods && item.methods.length) out.push(methodsSection(kind, name, item.methods, item.kind === 'class' ? 'all' : 'all'));
    if (item.events && item.events.length) out.push(eventsSection(kind, name, item.events));

    content.innerHTML = out.join('');

    if (member) {
      var target = document.getElementById('member-' + member.type + '-' + member.name) || document.getElementById('member-' + member.type);
      if (target) {
        target.classList.add('target');
        target.scrollIntoView({ block: 'start' });
      }
    } else {
      window.scrollTo(0, 0);
    }
  }

  function renderWelcome() {
    var files = state.doc.custom && state.doc.custom.general && state.doc.custom.general.files;
    var welcome = files && files.welcome;
    var html = md(welcome ? welcome.content : '# palantir.js\n\nNo welcome page found.');
    html = html.split('src="docs/').join('src="');
    state.content.innerHTML = '<article class="markdown">' + html + '</article>';
    state.content.querySelectorAll('h1, h2, h3, h4').forEach(function (heading) {
      heading.id = heading.id || slug(heading.textContent);
    });
    window.scrollTo(0, 0);
  }

  /* ------------------------------------------------------------- navigation */

  function buildNav() {
    var html = ['<a class="welcome-link" data-route="welcome" href="#/welcome">Welcome</a>'];
    Object.keys(SECTIONS).forEach(function (kind) {
      var cfg = SECTIONS[kind];
      var items = (state.doc[cfg.key] || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
      html.push(
        '<details class="group"' + (kind === 'class' ? ' open' : '') + '>' +
        '<summary>' + cfg.label + '<span class="count">' + items.length + '</span></summary>' +
        '<div class="items">'
      );
      items.forEach(function (item) {
        html.push(
          '<a class="nav-item" data-kind="' + kind + '" data-name="' + esc(item.name.toLowerCase()) + '" ' +
          'href="#/' + kind + '/' + encodeURIComponent(item.name) + '">' + esc(item.name) + '</a>'
        );
      });
      html.push('</div></details>');
    });
    state.nav.innerHTML = html.join('');
    state.nav.addEventListener('click', function (event) {
      var link = event.target.closest('a');
      if (link && window.innerWidth <= 860) window.scrollTo(0, 0);
    });
  }

  function setActive(kind, name) {
    state.nav.querySelectorAll('.nav-item.active, .welcome-link.active').forEach(function (node) {
      node.classList.remove('active');
    });
    if (!kind || kind === 'welcome') {
      var welcome = state.nav.querySelector('.welcome-link');
      if (welcome) welcome.classList.add('active');
      return;
    }
    var selector = '.nav-item[data-kind="' + kind + '"][data-name="' + esc((name || '').toLowerCase()) + '"]';
    var node = state.nav.querySelector(selector);
    if (node) {
      node.classList.add('active');
      if (node.closest('details')) node.closest('details').open = true;
    }
  }

  function route() {
    var raw = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
    var parts = raw.split('/').filter(Boolean);

    if (!parts.length || parts[0] === 'welcome') {
      setActive('welcome');
      renderWelcome();
      return;
    }

    var kind = parts[0];
    var name = parts[1] || '';
    var member = parts.length >= 4 ? { type: parts[2], name: parts[3] } : null;
    setActive(kind, name);
    renderItem(kind, name, member);
  }

  function applyFilter(query) {
    var q = query.trim().toLowerCase();
    var visibleTotal = 0;
    state.nav.querySelectorAll('details.group').forEach(function (group) {
      var visible = 0;
      group.querySelectorAll('.nav-item').forEach(function (item) {
        var show = !q || item.dataset.name.indexOf(q) !== -1;
        item.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      group.style.display = visible ? '' : 'none';
      if (q) group.open = true;
      visibleTotal += visible;
    });
    var welcome = state.nav.querySelector('.welcome-link');
    if (welcome) welcome.style.display = !q || 'welcome'.indexOf(q) !== -1 ? '' : 'none';
    var empty = state.nav.querySelector('.nav-empty');
    if (!empty) {
      empty = document.createElement('p');
      empty.className = 'nav-empty';
      empty.textContent = 'No match.';
      state.nav.appendChild(empty);
    }
    empty.style.display = visibleTotal === 0 && q ? 'block' : 'none';
  }

  /* ------------------------------------------------------------------ boot */

  async function init() {
    state.nav = document.getElementById('nav');
    state.content = document.getElementById('content');
    state.search = document.getElementById('search');

    try {
      var response = await fetch('main.json');
      if (!response.ok) throw new Error('HTTP ' + response.status);
      state.doc = await response.json();
    } catch (error) {
      state.content.innerHTML = '<h1 class="title">Failed to load documentation</h1><p class="muted">' + esc(error.message) +
        '<br />Serve this folder over HTTP (for example: <code>bunx serve docs</code>).</p>';
      return;
    }

    Object.keys(SECTIONS).forEach(function (kind) {
      var map = new Map();
      (state.doc[SECTIONS[kind].key] || []).forEach(function (item) { map.set(item.name, item); });
      state.bySection[SECTIONS[kind].key] = map;
    });

    buildNav();
    state.search.addEventListener('input', function () { applyFilter(state.search.value); });
    window.addEventListener('hashchange', route);
    route();
  }

  init();
})();
</script>
</body>
</html>
